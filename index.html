<title>Lesson Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F7F8; --surface:#FFFFFF; --surface-2:#EEF2F3; --surface-3:#E7ECEE;
    --ink:#182631; --ink-soft:#54636E; --ink-faint:#8593A0;
    --line:#E1E7EA; --line-strong:#D2DADE;
    --brand:#125A63; --brand-ink:#0C3B41; --brand-soft:#DFEEEE; --brand-softer:#EEF6F5;
    --accent:#DB7A38; --accent-ink:#A9581F; --accent-soft:#FBEBDD;
    --success:#2C935F; --success-soft:#DFF1E8;
    --warning:#B98218; --warning-soft:#F8EED6;
    --danger:#C24A38; --danger-soft:#F8E4DF;
    --shadow-sm:0 1px 2px rgba(18,38,44,.06),0 1px 1px rgba(18,38,44,.04);
    --shadow-md:0 6px 20px -8px rgba(18,38,44,.22),0 2px 6px -3px rgba(18,38,44,.12);
    --shadow-lg:0 20px 48px -16px rgba(18,38,44,.34);
    --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
    --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sidebar:248px;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme:dark){
      --bg:#0E151A; --surface:#151F26; --surface-2:#1C2830; --surface-3:#23313A;
      --ink:#E6EDF1; --ink-soft:#A3B1BC; --ink-faint:#6C7B87;
      --line:#26333C; --line-strong:#324049;
      --brand:#54B6BF; --brand-ink:#7FD0D6; --brand-soft:#183036; --brand-softer:#132428;
      --accent:#EC934F; --accent-ink:#F2AE78; --accent-soft:#33230F;
      --success:#4CB981; --success-soft:#16281F;
      --warning:#D6A34A; --warning-soft:#2A2110;
      --danger:#DE6A57; --danger-soft:#301813;
      --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px -10px rgba(0,0,0,.6);
      --shadow-lg:0 24px 56px -18px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E151A; --surface:#151F26; --surface-2:#1C2830; --surface-3:#23313A;
    --ink:#E6EDF1; --ink-soft:#A3B1BC; --ink-faint:#6C7B87;
    --line:#26333C; --line-strong:#324049;
    --brand:#54B6BF; --brand-ink:#7FD0D6; --brand-soft:#183036; --brand-softer:#132428;
    --accent:#EC934F; --accent-ink:#F2AE78; --accent-soft:#33230F;
    --success:#4CB981; --success-soft:#16281F;
    --warning:#D6A34A; --warning-soft:#2A2110;
    --danger:#DE6A57; --danger-soft:#301813;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 8px 24px -10px rgba(0,0,0,.6);
    --shadow-lg:0 24px 56px -18px rgba(0,0,0,.7);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  a{color:var(--brand)}
  ::selection{background:var(--brand-soft)}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);
    display:flex;flex-direction:column;padding:22px 16px;gap:6px;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
  .brand-mark{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--brand),var(--brand-ink));color:#fff;
    font-family:var(--serif);font-weight:600;font-size:20px;box-shadow:var(--shadow-sm);
  }
  .brand-name{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.1}
  .brand-sub{font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .nav-btn{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:none;background:transparent;
    color:var(--ink-soft);padding:10px 12px;border-radius:var(--r-md);font-weight:500;transition:.15s;
  }
  .nav-btn:hover{background:var(--surface-2);color:var(--ink)}
  .nav-btn.active{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
  .nav-btn svg{width:19px;height:19px;flex:none;stroke-width:1.9}
  .nav-count{margin-left:auto;font-size:12px;background:var(--surface-2);color:var(--ink-soft);
    padding:1px 8px;border-radius:20px;font-variant-numeric:tabular-nums}
  .nav-btn.active .nav-count{background:var(--surface);color:var(--brand-ink)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid var(--line)}
  .side-link{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--ink-faint);
    padding:8px 12px;border-radius:var(--r-sm);font-size:13.5px}
  .side-link:hover{background:var(--surface-2);color:var(--ink-soft)}
  .side-link svg{width:16px;height:16px;stroke-width:1.9}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{
    position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 86%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding:16px 30px;display:flex;align-items:center;gap:16px;
  }
  .page-title{font-size:22px}
  .page-sub{font-size:13px;color:var(--ink-soft);margin-top:1px}
  .topbar-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
  .content{padding:26px 30px 90px;max-width:1180px;width:100%;margin:0 auto;flex:1}

  /* ---------- Buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);
    color:var(--ink);padding:9px 15px;border-radius:var(--r-md);font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--ink-faint);box-shadow:var(--shadow-sm)}
  .btn svg{width:16px;height:16px;stroke-width:2}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-accent:hover{filter:brightness(.95)}
  .btn-ghost{background:transparent;border-color:transparent}
  .btn-ghost:hover{background:var(--surface-2);box-shadow:none}
  .btn-danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn-danger:hover{background:var(--danger-soft);border-color:transparent}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:var(--r-sm)}
  .btn-icon{padding:9px;border-radius:var(--r-md)}
  .btn-icon svg{width:17px;height:17px}
  .btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}

  /* ---------- Cards / surfaces ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
  .grid{display:grid;gap:16px}
  .section-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);font-weight:600}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;
    background:var(--surface-2);color:var(--ink-soft);white-space:nowrap;line-height:1.4}
  .pill.lvl{background:var(--brand-soft);color:var(--brand-ink)}
  .pill.type{background:var(--accent-soft);color:var(--accent-ink)}
  .pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .pill.ok{background:var(--success-soft);color:var(--success)}
  .pill.warn{background:var(--warning-soft);color:var(--warning)}

  .badge-ex{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    background:var(--warning-soft);color:var(--warning);padding:2px 7px;border-radius:6px}

  /* ---------- Dashboard ---------- */
  .hello{font-size:26px;margin-bottom:2px}
  .hello .day{color:var(--ink-faint)}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 26px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px}
  .stat .n{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:12.5px;color:var(--ink-soft);margin-top:7px}
  .stat .l b{color:var(--ink);font-weight:600}
  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
  .panel-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-size:16px}
  .panel-head .more{margin-left:auto}
  .panel-body{padding:8px}

  /* lesson row */
  .lrow{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:var(--r-md);cursor:pointer;transition:.12s}
  .lrow:hover{background:var(--surface-2)}
  .ldate{flex:none;width:52px;text-align:center;border-radius:var(--r-sm);background:var(--surface-2);padding:6px 4px;border:1px solid var(--line)}
  .ldate .d{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .ldate .m{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-top:2px}
  .lrow.done .ldate{background:var(--brand-softer);border-color:var(--brand-soft)}
  .lmain{min-width:0;flex:1}
  .lmain .who{font-weight:600;display:flex;align-items:center;gap:8px}
  .lmain .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ltime{flex:none;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums}

  .avatar{flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;
    font-weight:700;font-size:15px;font-family:var(--serif)}

  .empty{padding:34px 20px;text-align:center;color:var(--ink-soft)}
  .empty svg{width:34px;height:34px;stroke-width:1.6;color:var(--ink-faint);margin-bottom:8px}
  .empty h4{font-size:16px;margin-bottom:4px}
  .empty p{font-size:13.5px;max-width:360px;margin:0 auto 14px}

  /* ---------- Students grid ---------- */
  .toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  .search{flex:1;min-width:200px;position:relative}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-faint);stroke-width:2}
  .search input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line-strong);border-radius:var(--r-md);
    background:var(--surface);outline:none;transition:.15s}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px}
  .seg button{border:none;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink-soft)}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}

  .stu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
  .stu-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
    cursor:pointer;transition:.16s;display:flex;flex-direction:column;gap:13px;box-shadow:var(--shadow-sm)}
  .stu-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-strong)}
  .stu-top{display:flex;gap:12px;align-items:center}
  .stu-top .avatar{width:46px;height:46px;border-radius:13px;font-size:18px}
  .stu-name{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.15}
  .stu-goal{font-size:13px;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
  .stu-tags{display:flex;flex-wrap:wrap;gap:6px}
  .stu-foot{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-faint);margin-top:2px;padding-top:12px;border-top:1px solid var(--line)}
  .stu-foot svg{width:14px;height:14px;stroke-width:2}

  /* ---------- Student profile ---------- */
  .prof{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
  .prof-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
  .prof-head .avatar{width:60px;height:60px;border-radius:16px;font-size:24px}
  .prof-h-main{flex:1;min-width:0}
  .prof-name{font-size:26px;line-height:1.1;margin-bottom:7px}
  .prof-tags{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .back-link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink-soft);
    font-weight:600;font-size:13.5px;padding:0;margin-bottom:16px}
  .back-link:hover{color:var(--brand)}
  .back-link svg{width:16px;height:16px;stroke-width:2}

  .field{margin-bottom:2px}
  .field + .field{margin-top:18px}
  .field .flabel{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .field .flabel svg{width:15px;height:15px;stroke-width:2;color:var(--brand)}
  .field .fval{font-size:14.5px;color:var(--ink);white-space:pre-wrap;line-height:1.55}
  .field .fval.muted{color:var(--ink-faint);font-style:italic}

  .side-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;margin-bottom:16px}
  .side-card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .side-card h3 svg{width:17px;height:17px;stroke-width:2;color:var(--accent)}

  .ai-actions{display:flex;flex-direction:column;gap:9px}
  .ai-out{margin-top:14px;border-top:1px solid var(--line);padding-top:14px;display:none}
  .ai-out.show{display:block}
  .ai-body{font-size:14px;line-height:1.6;max-height:460px;overflow:auto}
  .ai-body h4{font-family:var(--sans);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--brand-ink);margin:14px 0 5px}
  .ai-body h4:first-child{margin-top:0}
  .ai-body ul{margin:4px 0 10px;padding-left:20px}
  .ai-body li{margin-bottom:4px}
  .ai-body p{margin:0 0 9px}
  .ai-body strong{color:var(--ink)}
  .thinking{display:flex;align-items:center;gap:9px;color:var(--ink-soft);font-size:14px;padding:6px 0}
  .thinking .spin{width:16px;height:16px;border:2px solid var(--line-strong);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* timeline / history */
  .tl{position:relative;padding-left:26px}
  .tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding:0 0 20px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
  .tl-item.scheduled .tl-dot{border-color:var(--accent);border-style:dashed}
  .tl-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;transition:.12s}
  .tl-card:hover{border-color:var(--line-strong);background:var(--surface-3)}
  .tl-date{font-size:12px;color:var(--ink-faint);font-weight:600;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tl-topic{font-weight:600;font-size:14.5px}
  .tl-note{font-size:13px;color:var(--ink-soft);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rating{display:inline-flex;gap:2px}
  .rating svg{width:13px;height:13px}
  .rating .on{color:var(--accent);fill:var(--accent)}
  .rating .off{color:var(--line-strong);fill:none}

  .prog-wrap{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:6px}
  .prog-bar{flex:1;background:var(--brand-soft);border-radius:5px 5px 2px 2px;min-height:5px;position:relative;transition:.2s}
  .prog-bar span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}

  /* ---------- Calendar ---------- */
  .cal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .cal-title{font-size:20px;min-width:160px;flex:1}
  .cal-legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink-soft);align-items:center}
  .cal-legend span{display:flex;align-items:center;gap:6px}
  .cal-legend .lg{width:10px;height:10px;border-radius:3px}

  /* week timetable */
  .tt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
  .tt{display:grid;grid-template-columns:56px repeat(7,minmax(90px,1fr));min-width:720px}
  .tt-corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .tt-dh{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tt-dh .tt-dow{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint)}
  .tt-dh .tt-dnum{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
  .tt-dh.today .tt-dow{color:var(--brand)}
  .tt-dh.today .tt-dnum{background:var(--brand);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px}
  .tt-chip{font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent-ink);border-radius:5px;padding:2px 6px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tt-chip.done{background:var(--brand-soft);color:var(--brand-ink)}
  .tt-gutter{border-right:1px solid var(--line)}
  .tt-hr{position:relative}
  .tt-hr span{position:absolute;top:-7px;right:7px;font-size:10.5px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .tt-col{position:relative;border-left:1px solid var(--line)}
  .tt-col.today{background-color:var(--brand-softer)!important}
  .tt-ev{position:absolute;left:3px;right:3px;border-radius:7px;padding:4px 7px;overflow:hidden;cursor:pointer;
    background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 34%,transparent);border-left:3px solid var(--accent);
    box-shadow:var(--shadow-sm);transition:.12s;line-height:1.25}
  .tt-ev.done{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 30%,transparent);border-left-color:var(--brand)}
  .tt-ev.noplan::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--warning)}
  .tt-ev:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);z-index:2}
  .tt-ev-top{display:flex;gap:5px;align-items:baseline;overflow:hidden;white-space:nowrap}
  .tt-ev-t{font-size:10.5px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
  .tt-ev.done .tt-ev-t{color:var(--brand-ink)}
  .tt-ev-n{font-size:12.5px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  .tt-ev-s{font-size:11px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-dow{text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);padding-bottom:2px}

      notes:"12-year-old girl, learning English as a hobby. Prefers British English. Medium level (≈B1). Keep lessons light, fun and topic-driven; grow vocabulary through things she enjoys.",

    {id:"nickyen4401576",name:"Nick Yen",level:"C1",types:["Conversation","Speaking"],

      goals:"Improve English reading and writing, and speak correct, fluent English with confidence. (Goal set by Bryan's parent for their 12-year-old son.)",
      notes:"12 years old, high school S1. Loves space & planets, Roblox, flags, and ocean animals — happy to just have fun chatting. Keep lessons playful and topic-driven around his interests. NOTE: you told the parent you weren't available on the requested day and asked to reschedule — confirm the 28 Sep slot before teaching.",

  lessons:[
    {id:"lesloya20260918trial",studentId:"loya",date:"2026-09-18",time:"",type:"Conversation",topic:"Trial lesson — getting to know you",status:"scheduled",plan:`## Lesson aim
Get to know Loya, help her feel relaxed speaking English, and spark her interest — while gently checking her level and starting to grow her vocabulary. This is a 25-minute trial lesson.

## Warm-up — hello & rapport (0–3 min)
- Greet her warmly in British English: "Hello Loya, lovely to meet you! How are you today?"
- Keep it relaxed and smiley: "Shall we start with something fun?"
- Teach one natural phrase she can reuse straight away: **"I'm really into…"** (for talking about hobbies).

## Getting to know you (3–10 min)
Ask simple, open questions and let her do most of the talking — notice where her vocabulary runs out (that's exactly what we'll build on):
- "What do you like doing in your free time?"
- "Do you have a favourite hobby or a favourite animal?"
- "What's your favourite subject at school?"
- "Tell me a little about your family or your best friend."
Recast her answers into fuller, natural British English and feed her 3–4 new words as they come up.

## Vocabulary through a picture book / video (10–18 min)
- Share a **picture book** page or a short **thematic video** (1–2 minutes) on a topic she likes — animals, everyday life, or a hobby.
- Pull out 6 useful words. Say each in British English; she repeats them.
- Quick game: "Can you make a sentence with ___?"

## Speaking task (18–22 min)
- Picture description or a mini role-play: "Tell me what you can see." She uses the new words in full sentences: "I can see…", "She is…".
- Gently encourage fluency over perfection — keep her talking.

## Wrap-up & next steps (22–25 min)
- Praise something specific she did well ("Your pronunciation of ___ was lovely!").
- Set a tiny, fun homework from a **handout**: 5 new words, and draw or find a picture for each.
- Agree the focus for regular lessons: growing vocabulary and conversation around topics she enjoys.

## Materials to use
- **Picture book** — for the vocabulary segment (a page on animals or daily life works well).
- **Thematic video** — a 1–2 minute clip on her favourite topic.
- **Handout** — a simple 5-word vocabulary sheet for homework.

## What to assess in the trial
- How much she understands and can say — to confirm the "medium" (B1) level.
- Her confidence, and which topics she lights up about.
- Where a lack of vocabulary slows her down — the main thing to build on next.`},
    {id:"lesnick20260919t0930",studentId:"nickyen4401576",date:"2026-09-19",time:"09:30",type:"Speaking",topic:"Speaking practice — fluency & talking faster",status:"scheduled",plan:`## Lesson aim
Build spoken fluency and speed — help Nick express ideas faster and more smoothly, with less hesitation. (~25–30 min speaking focus.)

## Warm-up — fluency sprint (0–5 min)
- "Just a minute": Nick speaks for 60 seconds on a familiar topic (his week, a recent news story) without stopping. Don't correct — just build flow.
- Note where he hesitates or reaches for words.

## Fluency drills (5–15 min)
- **Speak in chunks:** feed him natural connectors — "What I mean is…", "The thing is…", "to be honest…", "as far as I know…". He re-tells his topic using at least three.
- **Fast retell:** he explains an opinion or a simple process, then says it again about 20% faster, keeping the meaning. Repeat once.
- Push the pace gently; reward smoothness over perfection.

## Communicative task (15–23 min)
- "Going abroad" role-play: Nick explains his study-abroad plans and opinions to you as a new acquaintance or university contact. Keep it a real back-and-forth, and speak at natural pace so he practises keeping up.

## Wrap-up & feedback (23–25 min)
- Two things he did well, one speed/fluency target.
- Homework: record a 2-minute voice note on a topic, aiming for fewer pauses; list 5 phrases he wants to use more naturally.

## Materials & example prompts
- Use a **current affairs article** headline as a talking point.
- Prompts: "Tell me about your plans for studying abroad." / "What's something in the news you have an opinion on?" / "Describe your typical week — quickly!"

## What to assess
- Speaking rate and hesitation, range of linking phrases, and how comfortably he keeps a conversation going.`},
    {id:"lesnick20260919t1000",studentId:"nickyen4401576",date:"2026-09-19",time:"10:00",type:"Conversation",topic:"Understanding fast speech — listening & shadowing",status:"scheduled",plan:`## Lesson aim
My suggestion to pair with the speaking lesson: train Nick's ear for fast, natural speech and sharpen his own rhythm through shadowing — tackling "I can't understand what people say" and helping him talk faster. (~25 min.)

## Warm-up (0–4 min)
- Short chat about the clip's topic to activate vocabulary.

## Focused listening (4–12 min)
- Play a 30–60 second **thematic video** or podcast clip of natural, fast speech (an interview or the news).
- First listen — gist: "What's it about?" Second listen — details. Then show the transcript and highlight **connected speech**: reductions ("gonna", "wanna"), linking ("an_apple"), and weak forms ("to", "of").

## Shadowing (12–20 min)
- Play 10–15 second chunks; Nick "shadows" — repeats immediately, copying the rhythm, stress and speed. Build up to shadowing in real time.
- This trains comprehension and faster, more natural output at once.

## Speaking bridge (20–24 min)
- Nick summarises the clip in his own words at a brisk pace, using three new phrases from it.

## Wrap-up (24–25 min)
- Praise plus one focus. Homework: shadow the same clip three times and re-summarise it; jot down 5 reductions he heard.

## Materials & resources
- **Thematic video / podcast** clip of natural speech.
- **Handout:** the transcript with connected-speech features marked.
- Prompts: "What did you catch the first time?" / "Now say it exactly like they did."

## What to assess
- Gist vs detail comprehension, how well he copies rhythm and speed when shadowing, and any growth in his own pace.`},

const store = (function(){
  let db=null, mode="memory";
  const mem={};const subs={};
  const col=n=>mem[n]||(mem[n]=new Map());
  const subsFor=n=>subs[n]||(subs[n]=new Set());
  const LS="lessonstudio.v1";

  function loadLS(){
    try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);

  }

      localStorage.setItem(LS,JSON.stringify(o));}catch(e){}
  }
  function emit(coll){const arr=[...col(coll).values()];subsFor(coll).forEach(cb=>cb(arr));}

  function applySeed(){
    // On non-Claude hosting, load the schedule embedded in the code.
    // Re-applied only when SEED_VERSION changes, so edits made on the
    // site persist between updates but a new push always refreshes.
    let sv=null;try{sv=localStorage.getItem(LS+".seed");}catch(e){}
    if(String(SEED_VERSION)===sv)return;
    col("students").clear();col("lessons").clear();
    (SEED.students||[]).forEach(d=>col("students").set(d.id,{...d}));
    (SEED.lessons||[]).forEach(d=>col("lessons").set(d.id,{...d}));
    saveLS();
    try{localStorage.setItem(LS+".seed",String(SEED_VERSION));}catch(e){}
  }
  async function init(){
    try{ if(window.claude&&claude.use){ db=await claude.use("db"); } }catch(e){ db=null; }
    if(db){ mode="db"; }
    else { mode="local"; loadLS(); applySeed(); }
    return mode;
  }
  function subscribe(coll,cb){
    if(mode==="db"){
      return db.collection(coll).onSnapshot(snap=>{
        const arr=snap.docs.map(d=>({id:d.id,...d.data()}));cb(arr);
      },err=>{ console.warn("db sub",coll,err&&err.code); });
    }
    subsFor(coll).add(cb); cb([...col(coll).values()]);
    return ()=>subsFor(coll).delete(cb);
  }
  async function put(coll,id,data){
    const rec={...data,id};
    if(mode==="db"){ await db.collection(coll).doc(id).set(data); }
    else { col(coll).set(id,rec); saveLS(); emit(coll); }
    return rec;
  }
  async function remove(coll,id){
    if(mode==="db"){ await db.collection(coll).doc(id).delete(); }
    else { col(coll).delete(id); saveLS(); emit(coll); }
  }
  function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function getMode(){return mode;}
  return {init,subscribe,put,remove,newId,getMode};
})();

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();}
function colorFor(s){ if(s.color) return s.color; let h=0;for(const c of s.name)h=(h*31+c.charCodeAt(0))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length]; }
function fmtDate(iso,opts){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString(undefined,opts||{month:"short",day:"numeric"});}
function fmtLong(iso){return new Date(iso+"T00:00:00").toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return ymd(new Date());}
function addDays(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d);}
function addMonths(iso,n){const d=new Date(iso+"T00:00:00");d.setMonth(d.getMonth()+n);return ymd(d);}
function relDay(iso){
  const t=new Date(todayISO()+"T00:00:00"),d=new Date(iso+"T00:00:00");
  const diff=Math.round((d-t)/86400000);
  if(diff===0)return"Today";if(diff===1)return"Tomorrow";if(diff===-1)return"Yesterday";
  if(diff>1&&diff<7)return"In "+diff+" days";if(diff<-1&&diff>-7)return Math.abs(diff)+" days ago";
  return fmtDate(iso);
}
function currentStudents(){return state.usingExamples?state._exStudents:state.students;}
function currentLessons(){return state.usingExamples?state._exLessons:state.lessons;}
function lessonsFor(id){return currentLessons().filter(l=>l.studentId===id);}
function starSVG(on){return `<svg viewBox="0 0 24 24" class="${on?'on':'off'}" stroke="currentColor" stroke-width="1.5"><path d="M12 3l2.6 5.6 6 .7-4.4 4.1 1.2 6L12 16.9 6.6 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>`;}
function ratingStars(n){let h='<span class="rating">';for(let i=1;i<=5;i++)h+=starSVG(i<=(n||0));return h+"</span>";}
function toast(msg,icon){
  const t=document.createElement("div");t.className="toast";
  t.innerHTML=(icon||`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 13l4 4L19 7"/></svg>`)+esc(msg);
  $("#toasts").appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition=".3s";setTimeout(()=>t.remove(),300);},2200);
}

/* light markdown → html for AI output */
function mdToHtml(src){
  const lines=src.replace(/\r/g,"").split("\n");let out="",inList=false;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");
  for(let raw of lines){
    const line=raw.trimEnd();
    if(/^\s*[-*•]\s+/.test(line)){if(!inList){out+="<ul>";inList=true;}out+="<li>"+inline(line.replace(/^\s*[-*•]\s+/,""))+"</li>";continue;}
    if(inList){out+="</ul>";inList=false;}
    if(/^#{1,6}\s+/.test(line)){out+="<h4>"+inline(line.replace(/^#{1,6}\s+/,""))+"</h4>";continue;}
    if(/^\s*\d+\.\s+/.test(line)){out+="<p>"+inline(line)+"</p>";continue;}
    if(line.trim()==="")continue;
    out+="<p>"+inline(line)+"</p>";
  }
  if(inList)out+="</ul>";
  return out;
}

  }
  if(needPlan>0&&!state.usingExamples){
    html+=`<div class="reminder"><div class="rem-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l1.9 4.7L18.5 9l-4.6 1.3L12 15l-1.9-4.7L5.5 9l4.6-1.3z"/></svg></div>

    <div class="stat"><div class="n">${needPlan}</div><div class="l">Upcoming <b>need a plan</b></div></div>
  </div>`;

  html+=`<div class="dash-grid">`;
  // upcoming
  html+=`<div class="panel"><div class="panel-head"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3"/></svg><h3>Upcoming lessons</h3><button class="btn btn-sm btn-ghost more" data-view="schedule">Calendar →</button></div><div class="panel-body">`;
  if(upcoming.length===0){

/* ---------- Schedule / calendar ---------- */
function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function renderSchedule(){
  if(!state.weekStart)state.weekStart=mondayOf(new Date());
  const L=currentLessons(),today=todayISO(),mode=state.calMode;
  let html="";
  if(state.usingExamples){
    html+=`<div class="banner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
      <div>This is a <b>sample timetable</b>. Add your own students and lessons and they'll appear right here.</div>
      <button class="btn btn-sm btn-primary" data-act="add-student">Add my first student</button></div>`;
  }
  // reminders
  const upcoming=L.filter(l=>l.status==="scheduled"&&l.date>=today);
  const todayLs=upcoming.filter(l=>l.date===today).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const needPlan=upcoming.filter(l=>!l.plan).length;
  if(todayLs.length){
    const bits=todayLs.map(l=>{const s=currentStudents().find(x=>x.id===l.studentId);return (l.time?l.time+" ":"")+(s?s.name.split(" ")[0]:"");}).join(" · ");
    html+=`<div class="reminder soft"><div class="rem-ico">📅</div><div class="rem-txt"><b>${todayLs.length} lesson${todayLs.length===1?'':'s'} today</b> — ${esc(bits)}</div></div>`;
  }
  if(needPlan>0&&!state.usingExamples){
    html+=`<div class="reminder"><div class="rem-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3l1.9 4.7L18.5 9l-4.6 1.3L12 15l-1.9-4.7L5.5 9l4.6-1.3z"/></svg></div>
      <div class="rem-txt"><b>${needPlan} upcoming lesson${needPlan===1?'':'s'} still need a plan.</b> Prepare them all — one plan waiting on each.</div>
      <button class="btn btn-accent btn-sm" data-act="prepare-plans">Prepare ${needPlan}</button></div>`;
  }
  // header
  const ws=state.weekStart,we=new Date(ws);we.setDate(ws.getDate()+6);
  const mon=x=>x.toLocaleDateString(undefined,{month:'short'});
  const title=mode==="week"
    ? (ws.getMonth()===we.getMonth()
        ? ws.getDate()+" – "+we.getDate()+" "+mon(we)+" "+we.getFullYear()
        : ws.getDate()+" "+mon(ws)+" – "+we.getDate()+" "+mon(we)+" "+we.getFullYear())
    : state.calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  html+=`<div class="cal-head">
    <div class="seg" id="modeSeg"><button data-mode="week" class="${mode==='week'?'active':''}">Week</button><button data-mode="month" class="${mode==='month'?'active':''}">Month</button></div>
    <h2 class="cal-title">${title}</h2>
    <button class="btn btn-icon" data-cal="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="btn btn-icon" data-cal="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="btn btn-sm" data-cal="today">Today</button>
    <div class="cal-legend"><span><span class="lg" style="background:var(--accent)"></span>Booked</span><span><span class="lg" style="background:var(--brand)"></span>Taught</span></div>
  </div>`;
  html+= mode==="week"? weekGrid() : monthGrid();
  content.innerHTML=html;
}
function weekGrid(){
  const L=currentLessons(),today=todayISO();
  const isoOf=ymd;
  const days=[...Array(7)].map((_,i)=>{const d=new Date(state.weekStart);d.setDate(d.getDate()+i);return d;});
  const week=days.map(isoOf);
  const wl=L.filter(l=>week.includes(l.date));
  const isTimed=l=>l.time&&/^\d\d:\d\d/.test(l.time);
  const timed=wl.filter(isTimed);
  let minH=8,maxH=20;
  timed.forEach(l=>{const h=+l.time.slice(0,2);if(h<minH)minH=h;if(h+1>maxH)maxH=h+1;});
  minH=Math.max(6,Math.min(minH,8));maxH=Math.min(23,Math.max(maxH,20));
  const rowH=46,H=(maxH-minH)*rowH;
  const untimed={};wl.filter(l=>!isTimed(l)).forEach(l=>{(untimed[l.date]=untimed[l.date]||[]).push(l);});
  let h=`<div class="tt-wrap"><div class="tt" style="grid-template-rows:auto ${H}px">`;
  h+=`<div class="tt-corner"></div>`;
  days.forEach(d=>{const iso=isoOf(d);const ut=untimed[iso]||[];
    h+=`<div class="tt-dh ${iso===today?'today':''}"><div class="tt-dow">${d.toLocaleDateString(undefined,{weekday:'short'})}</div><div class="tt-dnum">${d.getDate()}</div>
      ${ut.map(l=>{const s=currentStudents().find(x=>x.id===l.studentId);return `<div class="tt-chip ${l.status}" data-lesson="${l.id}">${esc(s?s.name.split(' ')[0]:'Lesson')}</div>`;}).join("")}</div>`;});
  h+=`<div class="tt-gutter">`;
  for(let hr=minH;hr<maxH;hr++)h+=`<div class="tt-hr" style="height:${rowH}px"><span>${hr}:00</span></div>`;
  h+=`</div>`;
  days.forEach(d=>{const iso=isoOf(d);
    h+=`<div class="tt-col ${iso===today?'today':''}" style="height:${H}px;background-image:repeating-linear-gradient(var(--line) 0 1px,transparent 1px ${rowH}px)">`;
    timed.filter(l=>l.date===iso).sort((a,b)=>a.time.localeCompare(b.time)).forEach(l=>{
      const mins=(+l.time.slice(0,2))*60+(+l.time.slice(3,5));
      const top=(mins-minH*60)/60*rowH,ht=Math.max(38,rowH*(55/60));
      const s=currentStudents().find(x=>x.id===l.studentId);
      h+=`<div class="tt-ev ${l.status} ${l.status==='scheduled'&&!l.plan?'noplan':''}" data-lesson="${l.id}" style="top:${top}px;height:${ht}px" title="${esc((s?s.name:'')+' · '+(l.topic||''))}">
        <div class="tt-ev-top"><span class="tt-ev-t">${esc(l.time)}</span><span class="tt-ev-n">${esc(s?s.name.split(' ')[0]:'Lesson')}</span></div>
        <div class="tt-ev-s">${esc(l.topic||l.type||'')}</div></div>`;
    });
    h+=`</div>`;
  });
  h+=`</div></div>`;
  const anyWeek=wl.length;
  if(!anyWeek)h+=`<div class="empty" style="padding:30px 20px"><h4>No lessons this week</h4><p>Use “Add lesson” (top right) to book one — set it to repeat and it fills future weeks automatically.</p></div>`;
  return h;
}
function monthGrid(){
  const m=state.calMonth,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),start=new Date(first);start.setDate(1-((first.getDay()+6)%7));
  const L=currentLessons(),today=todayISO();const byDate={};L.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l);});
  let html=`<div class="cal-grid">`;
  ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<42;i++){
    const d=new Date(start);d.setDate(start.getDate()+i);
    const iso=ymd(d),out=d.getMonth()!==mo;
    const evs=(byDate[iso]||[]).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
    html+=`<div class="cal-cell ${out?'out':''} ${iso===today?'today':''}">`;
    if(!out){
      html+=`<div class="cnum">${d.getDate()}</div>`;
      evs.slice(0,3).forEach(l=>{const s=currentStudents().find(x=>x.id===l.studentId);
        html+=`<div class="cal-ev ${l.status}" data-lesson="${l.id}" title="${esc((s?s.name:'')+' — '+(l.topic||''))}">${l.time?esc(l.time)+' ':''}${esc(s?s.name.split(' ')[0]:'Lesson')}</div>`;});
      if(evs.length>3)html+=`<div class="cal-more">+${evs.length-3} more</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;
  return html;
}

function scrimWrap(inner){

  scrim.querySelector("#fSave").onclick=async()=>{

      for(let i=0;i<count;i++){

/* Auto-roll a completed lesson's notes into the student's "what to do next" */
async function carryForward(studentId,lesson){
  const s=state.students.find(x=>x.id===studentId);if(!s)return null;
  const newer=state.lessons.filter(l=>l.studentId===studentId&&l.status==="done"&&l.id!==lesson.id&&l.date>lesson.date);
  if(newer.length)return null; // a more recent lesson already sets the direction
  const bits=[];
  if(lesson.homework)bits.push("Follow up on homework: "+lesson.homework);
  if(lesson.progressNote)bits.push(lesson.progressNote);
  if(!bits.length)return null;
  const next="After "+fmtDate(lesson.date)+" ("+(lesson.topic||lesson.type||"last lesson")+"): "+bits.join(" — ");
  const {id,...rest}=s;
  await store.put("students",s.id,{...rest,nextSteps:next,preparedStale:true});
  return s.name.split(" ")[0];
}

   ============================================================ */
let sampleFn=null,sampleReady=false;
async function ensureSample(){if(sampleReady)return sampleFn;sampleReady=true;
  try{if(window.claude&&claude.use)sampleFn=await claude.use("sample");}catch(e){sampleFn=null;}return sampleFn;}
let lastAIText="",lastAIStudent=null;

function buildContext(s){
  const ls=lessonsFor(s.id).filter(l=>l.status==="done").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  let ctx=`Student: ${s.name}\nCEFR level: ${s.level}\nLesson focus: ${(s.types||[]).join(", ")||"General English"}\n`;
  ctx+=`Goals: ${s.goals||"(not specified)"}\n`;
  ctx+=`Teacher's notes on the learner: ${s.notes||"(none)"}\n`;
  ctx+=`Planned next steps: ${s.nextSteps||"(none)"}\n`;
  if(s.materials)ctx+=`Books & materials to use with THIS student (reference these specifically): ${s.materials}\n`;
  ctx+="\n";
  if(ls.length){ctx+="Recent lessons (most recent first):\n";
    ls.forEach(l=>{ctx+=`• ${l.date} — ${l.topic||l.type||"lesson"}: ${l.whatWeDid||""}${l.progressNote?" | Progress: "+l.progressNote:""}${l.homework?" | Homework: "+l.homework:""}\n`;});
  } else ctx+="No previous lessons logged yet.\n";
  const st=state.settings||{};
  if(st.resources)ctx+="\nTeacher's own materials, coursebooks, apps and websites to build the lesson around — reference these SPECIFICALLY (name the book and a plausible unit/section, the app and how to use it): "+st.resources+"\n";
  if(st.style)ctx+="Teacher's preferred style: "+st.style+"\n";
  return ctx;
}
function buildPlanPrompt(s){
  return `You are an experienced English teacher planning a one-to-one 50-minute online lesson. Using the student profile below, write a complete, ready-to-teach lesson plan.\n\n${buildContext(s)}\nWrite the plan in Markdown with these sections as ## headings: **Lesson aim** (1 sentence), **Warm-up** (5 min), **Main activities** (timed stages with what the teacher does and what the student does), **Speaking / practice task**, **Materials & example questions** (give REAL example questions/sentences to use, not placeholders), **Resources to use** (point to specific things from the teacher's toolkit above where given — a coursebook unit, an app, a website; if the teacher listed none, suggest well-known resources suited to this level/exam such as relevant coursebooks, past papers, or free tools), **Homework**, and **What to assess**. Tailor everything to the student's level (${s.level}), goals and recent lessons; build naturally on the most recent lesson and homework. Keep it practical and specific.`;
}
function buildIdeasPrompt(s){
  return `You are an experienced English teacher. Suggest fresh, engaging teaching ideas for the student below.\n\n${buildContext(s)}\nReply in Markdown with these ## sections: **Topics they'd enjoy** (3-4, matched to their interests), **Activities** (3-4 concrete activities with a one-line how-to), **Example questions/prompts** (5-6 real questions at their level), and **Useful language/vocabulary to introduce** (a short list). Be specific to their level (${s.level}) and goals. No generic filler.`;
}
async function runAI(kind){
  const s=currentStudents().find(x=>x.id===state.activeStudent);if(!s)return;
  const out=$("#aiOut"),inner=$("#aiInner"),btns=$("#aiButtons"),saveBtn=modalRoot&&null;
  out.classList.add("show");btns.hidden=true;
  const fn=await ensureSample();
  if(!fn){inner.innerHTML=`<div class="fval muted">The AI assistant runs when you open this page inside Claude. It doesn't seem to be available here — everything else works normally.</div>`;return;}
  inner.innerHTML=`<div class="thinking"><div class="spin"></div>Thinking through ${esc(s.name.split(' ')[0])}'s ${kind==='plan'?'lesson plan':'ideas'}…</div>`;
  const prompt=kind==="plan"?buildPlanPrompt(s):buildIdeasPrompt(s);
  try{
    const {text}=await fn(prompt,{modelTier:"default",onText:({text})=>{inner.innerHTML=mdToHtml(text);out.scrollTop=out.scrollHeight;}});
    inner.innerHTML=mdToHtml(text);lastAIText=text;lastAIStudent=s.id;
    btns.hidden=false;
    const saveB=btns.querySelector('[data-act="ai-save"]');
    if(saveB)saveB.hidden=(kind!=="plan"||state.usingExamples);
  }catch(e){
    const msg={not_granted:"AI needs your permission to run — it uses your own Claude account. Reload and allow it, or continue without it.",
      rate_limited:"Claude is busy right now. Give it a moment and try again.",
      refused:"Couldn't generate that — try adjusting the student's goals or notes.",
      cancelled:""}[e.code]||"Something interrupted the request. Please try again.";
    if(e.code==="cancelled")return;
    inner.innerHTML=`<div class="fval muted">${esc(msg)}</div>`;
  }
}

/* Bulk-prepare lesson plans for every upcoming lesson that doesn't have one */
async function prepareAllPlans(){
  if(state.usingExamples){toast("Add your own students first");studentForm();return;}
  const today=todayISO();
  const targets=state.lessons.filter(l=>l.status==="scheduled"&&l.date>=today&&!l.plan)
    .sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  if(!targets.length){toast("Every upcoming lesson already has a plan 🎉");return;}
  const fn=await ensureSample();
  if(!fn){toast("The AI runs when you open this page inside Claude");return;}
  let cancelled=false,doneN=0,failN=0;
  const rows=targets.map(l=>{const s=state.students.find(x=>x.id===l.studentId);
    return `<div class="prep-row" id="prep-${l.id}"><span class="prep-ico wait"></span>
      <div class="prep-main"><b>${esc(s?s.name:'Student')}</b><span>${esc(relDay(l.date))}${l.time?' · '+esc(l.time):''} · ${esc(l.topic||l.type||'Lesson')}</span></div></div>`;}).join("");
  const scrim=scrimWrap(`<div class="modal"><div class="modal-head"><h2>Preparing lesson plans</h2></div>
    <div class="modal-body"><p class="fval" style="margin:0 0 4px">Writing a plan for each upcoming lesson using each student's goals and history. You can keep this open — it runs on your Claude account.</p>
      <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px" id="prepStatus">0 of ${targets.length} done</div>
      <div class="prep-list">${rows}</div></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="prepCancel">Cancel</button><button class="btn btn-primary" id="prepClose" hidden>Done</button></div></div>`);
  openModal(scrim);
  const statusEl=scrim.querySelector("#prepStatus");
  scrim.querySelector("#prepCancel").onclick=()=>{cancelled=true;closeModal();};
  const setIco=(id,cls)=>{const r=scrim.querySelector("#prep-"+id+" .prep-ico");if(r)r.className="prep-ico "+cls;};
  for(const l of targets){
    if(cancelled)return;
    setIco(l.id,"run");
    const s=state.students.find(x=>x.id===l.studentId);
    if(!s){setIco(l.id,"fail");failN++;continue;}
    try{
      const {text}=await fn(buildPlanPrompt(s),{modelTier:"default"});
      const {id,...rest}=l;await store.put("lessons",l.id,{...rest,plan:text});
      setIco(l.id,"ok");doneN++;
    }catch(e){
      setIco(l.id,"fail");failN++;
      if(e.code==="not_granted"){statusEl.textContent="AI permission was declined — nothing was charged.";break;}
      if(e.code==="rate_limited"){statusEl.textContent="Claude is busy — stopped early. Try the rest again in a minute.";break;}
    }
    if(statusEl)statusEl.textContent=doneN+" of "+targets.length+" done"+(failN?" · "+failN+" skipped":"");
  }
  if(cancelled)return;
  const cancelBtn=scrim.querySelector("#prepCancel"),closeBtn=scrim.querySelector("#prepClose");
  if(cancelBtn)cancelBtn.hidden=true;if(closeBtn){closeBtn.hidden=false;closeBtn.onclick=()=>{closeModal();render();};}
  if(doneN)toast(doneN+" plan"+(doneN===1?"":"s")+" ready");
  render();
}

const preparing=new Set();
function nextBooked(sid){return lessonsFor(sid).filter(l=>l.status==="scheduled"&&l.date>=todayISO()).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")))[0]||null;}
function preparedOf(s){
  const nb=nextBooked(s.id);
  if(nb&&nb.plan)return{plan:nb.plan,lesson:nb,onLesson:true};
  if(s.preparedPlan&&!s.preparedStale)return{plan:s.preparedPlan,lesson:nb,onLesson:false};

function npButtons(s,prepared,nb){

function npPlaceholder(s){

  return `<div class="thinking"><div class="spin"></div>Preparing ${esc(s.name.split(" ")[0])}'s next lesson… this happens once, then it's instant.</div>`;

async function streamPlan(s,prompt,opts){
  opts=opts||{};const save=opts.save!==false;
  const fn=await ensureSample();
  const body=$("#nextPlanBody"),acts=$("#npActions");
  if(!fn){if(body)body.innerHTML=`<div class="fval muted">The plan writer runs when you open this page inside Claude. Open it there and lessons prepare themselves — everything else works anywhere.</div>`;return;}
  if(acts)acts.innerHTML="";
  if(body&&!body.querySelector(".thinking"))body.innerHTML=`<div class="thinking"><div class="spin"></div>Writing…</div>`;
  try{
    const {text}=await fn(prompt,{modelTier:"default",cache:false,onText:({text})=>{const b=$("#nextPlanBody");if(b)b.innerHTML=mdToHtml(text);}});
    state.currentPlan=text;
    if(save&&!state.usingExamples){
      const nb=nextBooked(s.id);
      if(nb){const {id,...rest}=nb;await store.put("lessons",nb.id,{...rest,plan:text});}
      else{const {id,...rest}=s;await store.put("students",s.id,{...rest,preparedPlan:text,preparedStale:false,preparedAt:todayISO()});}
    }else{
      const b=$("#nextPlanBody");if(b)b.innerHTML=mdToHtml(text);
      const a=$("#npActions");if(a)a.innerHTML=npButtons(s,{plan:text,onLesson:false,lesson:null},null);
    }
    return text;
  }catch(e){
    if(e.code==="cancelled")return;
    const b=$("#nextPlanBody");if(b)b.innerHTML=`<div class="fval muted">${esc(aiErr(e))}</div><button class="btn btn-sm btn-accent" data-act="plan-regen" style="margin-top:10px">Try again</button>`;
  }
}

    const prompt=`You are an English teacher revising a lesson plan for a ${esc(s.level)} student. Here is the current plan:\n\n"""\n${cur}\n"""\n\nRevise it as requested: ${instr}\n\nKeep the same Markdown structure (## section headings and bullet lists) and keep it practical with real example questions. Return the FULL revised plan only — no commentary before or after.`;
    streamPlan(s,prompt,{save:!state.usingExamples});};

async function attachPlan(){
  const s=currentStudents().find(x=>x.id===state.activeStudent);if(!s)return;
  const nb=nextBooked(s.id);if(!nb||!s.preparedPlan)return;
  const {id,...rest}=nb;await store.put("lessons",nb.id,{...rest,plan:s.preparedPlan});
  const {id:sid,...srest}=s;await store.put("students",s.id,{...srest,preparedPlan:"",preparedStale:false});
  toast("Attached to "+relDay(nb.date)+"'s lesson");
}
function planToPDF(s,planText,nb){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const M=54,W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight(),maxW=W-M*2;
  let y=M;
  const ensure=h=>{if(y+h>H-M){doc.addPage();y=M;}};
  doc.setFont("helvetica","bold");doc.setFontSize(19);doc.setTextColor(18,90,99);
  doc.text("Lesson Plan",M,y);y+=24;
  doc.setFontSize(13);doc.setTextColor(24,38,49);
  doc.text(s.name+"  ·  "+s.level+((s.types&&s.types.length)?"  ·  "+s.types.join(", "):""),M,y);y+=16;
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.setTextColor(125,135,145);
  const when=nb?("Booked "+nb.date+(nb.time?" "+nb.time:"")):"For the next session";
  doc.text(when+"     Prepared "+todayISO()+"     Lesson Studio",M,y);y+=12;
  doc.setDrawColor(210,220,224);doc.line(M,y,W-M,y);y+=20;
  const lines=String(planText).replace(/\r/g,"").split("\n");
  for(const raw of lines){
    const line=raw.replace(/\s+$/,"");
    if(!line.trim()){y+=6;continue;}
    let heading=false,bullet=false,text=line;
    if(/^#{1,6}\s+/.test(line)){heading=true;text=line.replace(/^#{1,6}\s+/,"");}
    else if(/^\s*[-*•]\s+/.test(line)){bullet=true;text=line.replace(/^\s*[-*•]\s+/,"");}
    text=text.replace(/\*\*(.+?)\*\*/g,"$1").replace(/\*(.+?)\*/g,"$1").replace(/`/g,"");
    if(heading){doc.setFont("helvetica","bold");doc.setFontSize(12.5);doc.setTextColor(14,70,77);y+=8;}
    else{doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(30,42,49);}
    const indent=bullet?M+16:M,wrapW=bullet?maxW-16:maxW;
    const wrapped=doc.splitTextToSize(text,wrapW);
    for(let i=0;i<wrapped.length;i++){
      ensure(16);
      if(bullet&&i===0){doc.setFillColor(219,122,56);doc.circle(M+6,y-3,1.7,"F");}
      doc.text(wrapped[i],indent,y);y+=heading?17:14.5;
    }
    if(heading)y+=2;
  }
  return doc.output("blob");
}
async function savePlanPDF(){
  const s=currentStudents().find(x=>x.id===state.activeStudent);if(!s)return;
  const p=preparedOf(s);const planText=p?p.plan:(state.currentPlan||"");
  if(!planText){toast("No plan yet");return;}
  if(!(window.jspdf&&window.jspdf.jsPDF)){toast("PDF tool still loading — try again in a second");return;}
  let blob;try{blob=planToPDF(s,planText,p?p.lesson:nextBooked(s.id));}catch(e){toast("Couldn't build the PDF");return;}
  const fname=("Lesson plan - "+s.name+" - "+todayISO()+".pdf").replace(/[\\/:*?"<>|]/g,"-");
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use("downloads");}catch(e){}
  if(dl){try{await dl.save({filename:fname,data:blob});toast("PDF saved");return;}catch(e){if(e.code==="declined")return;}}
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);toast("PDF downloaded");}
  catch(e){toast("Couldn't save the PDF here");}
}

/* ---------- Import bookings from a screenshot ---------- */
async function importForm(){
  const fn=await ensureSample();
  const scrim=scrimWrap(`<div class="modal wide"><div class="modal-head"><h2>Import bookings from a screenshot</h2><button class="x" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body" id="impBody"></div><div class="modal-foot" id="impFoot"></div></div>`);
  openModal(scrim);
  scrim.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  const body=scrim.querySelector("#impBody"),foot=scrim.querySelector("#impFoot");
  let file=null,rows=[];
  const closeFoot=()=>{const b=foot.querySelector("[data-close]");if(b)b.onclick=closeModal;};
  if(!fn){body.innerHTML=`<div class="fval muted">Screenshot import runs when you open this page inside Claude — it uses your Claude account to read the image. Open it there to use it. You can always add lessons with “Add lesson”.</div>`;foot.innerHTML=`<button class="btn btn-ghost" data-close>Close</button>`;closeFoot();return;}
  let caps=null;try{caps=await fn.limits();}catch(e){}
  if(!caps||!caps.images){body.innerHTML=`<div class="fval muted">This view can't read images at the moment. You can still add lessons with “Add lesson”, and set them to repeat weekly so they fill your timetable automatically.</div>`;foot.innerHTML=`<button class="btn btn-ghost" data-close>Close</button>`;closeFoot();return;}

  function matchStudent(name){const S=state.students,n=String(name).trim().toLowerCase();
    const hit=S.find(s=>s.name.toLowerCase()===n)||S.find(s=>s.name.toLowerCase().split(" ")[0]===n.split(" ")[0]&&n.length>1);return hit?hit.id:"";}
  function stepPick(){
    file=null;
    body.innerHTML=`<p class="fval" style="margin:0 0 12px;color:var(--ink-soft);font-size:13.5px">Take a screenshot of your AmazingTalker weekly schedule — anything that shows student names next to days and times — and drop it in below. Claude reads it and turns it into bookings for you to check.</p>
      <label class="dropzone" id="dz"><input type="file" accept="image/*" id="impFile" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M8 8l4-4 4 4M4 20h16"/></svg>
        <b>Choose or drop a screenshot</b><span>PNG or JPG · or paste with Ctrl/⌘-V</span></label>
      <div id="impPreview"></div>`;
    const dz=body.querySelector("#dz"),fileInp=body.querySelector("#impFile");
    fileInp.onchange=()=>{if(fileInp.files[0])setFile(fileInp.files[0]);};
    dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
    dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");const f=e.dataTransfer.files[0];if(f&&f.type.startsWith("image/"))setFile(f);});
    foot.innerHTML=`<button class="btn btn-ghost" data-close>Cancel</button>`;closeFoot();
  }
  function setFile(f){file=f;const url=URL.createObjectURL(f);
    const pv=body.querySelector("#impPreview");if(pv)pv.innerHTML=`<div class="imp-preview"><img src="${url}" alt="screenshot preview"><div>Looks good — read it when you're ready.</div></div>`;
    foot.innerHTML=`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="impRead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3l1.9 4.7L18.5 9l-4.6 1.3L12 15l-1.9-4.7L5.5 9l4.6-1.3z"/></svg>Read bookings</button>`;
    closeFoot();foot.querySelector("#impRead").onclick=readFile;}
  async function readFile(){
    body.innerHTML=`<div class="thinking"><div class="spin"></div>Reading your schedule…</div>`;
    foot.innerHTML=`<button class="btn btn-ghost" data-close>Cancel</button>`;closeFoot();
    const year=new Date().getFullYear(),mon=ymd(mondayOf(new Date()));
    const prompt=`This is a screenshot of my weekly teaching schedule from AmazingTalker (an online tutoring site). Extract every booked lesson with a person's name. For each booking give: "student" (name exactly as shown), "date" (YYYY-MM-DD — the current year is ${year}; use the dates shown in the image; if only weekday names appear, use the week beginning Monday ${mon}), and "time" (start time as HH:MM, 24-hour). Reply with ONLY a JSON array like [{"student":"Maria","date":"${year}-01-15","time":"17:00"}]. Ignore empty slots, "available" blocks, and anything without a student's name.`;
    try{
      const data=await fn.json(prompt,{images:file,modelTier:"default"});
      rows=(Array.isArray(data)?data:[]).filter(r=>r&&r.student).map(r=>({student:String(r.student),date:String(r.date||todayISO()).slice(0,10),time:String(r.time||"").slice(0,5),match:matchStudent(r.student)}));
      if(!rows.length){body.innerHTML=`<div class="fval muted">I couldn't find any bookings in that image. Try a clearer screenshot that shows names and times — or add lessons manually.</div>`;foot.innerHTML=`<button class="btn btn-ghost" data-close>Close</button><button class="btn" id="impBack">Try another image</button>`;closeFoot();foot.querySelector("#impBack").onclick=stepPick;return;}
      stepReview();
    }catch(e){
      body.innerHTML=`<div class="fval muted">${esc(aiErr(e))}</div>`;
      foot.innerHTML=`<button class="btn btn-ghost" data-close>Close</button><button class="btn" id="impBack">Try again</button>`;closeFoot();foot.querySelector("#impBack").onclick=stepPick;
    }
  }
  function impRow(r,i,S){
    const opts=`<option value="">＋ Create “${esc(r.student)}”</option>`+S.map(s=>`<option value="${s.id}" ${r.match===s.id?'selected':''}>${esc(s.name)}</option>`).join("");
    return `<div class="imp-row">
      <select class="inp" data-k="match" data-i="${i}">${opts}</select>
      <input type="date" class="inp" data-k="date" data-i="${i}" value="${esc(r.date)}">
      <input type="time" class="inp" data-k="time" data-i="${i}" value="${esc(r.time)}">
      <button class="btn btn-ghost btn-icon" data-rm="${i}" title="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  }
  function stepReview(){
    const S=state.students;
    body.innerHTML=`<p class="fval" style="margin:0 0 6px;color:var(--ink-soft);font-size:13.5px">Found <b>${rows.length}</b> booking${rows.length===1?'':'s'}. Match each to a student (or create a new one), fix any date/time, then add them.</p>
      <div class="imp-heads"><span>Student</span><span>Date</span><span>Time</span><span></span></div>
      <div class="imp-rows">${rows.map((r,i)=>impRow(r,i,S)).join("")}</div>`;
    foot.innerHTML=`<button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="impAdd">Add ${rows.length} to timetable</button>`;closeFoot();
    foot.querySelector("#impAdd").onclick=commit;
    const rc=body.querySelector(".imp-rows");
    rc.addEventListener("change",e=>{const el=e.target,i=+el.dataset.i;if(isNaN(i))return;rows[i][el.dataset.k]=el.value;});
    rc.addEventListener("click",e=>{const rm=e.target.closest("[data-rm]");if(rm){rows.splice(+rm.dataset.rm,1);if(!rows.length){stepPick();}else stepReview();}});
  }
  async function commit(){
    const valid=rows.filter(r=>r.date&&r.time);
    if(!valid.length){toast("Add a date and time to each booking");return;}
    let added=0,created=0,skipped=0;const nameToId={};
    for(const r of valid){
      let sid=r.match;
      if(!sid){const k=r.student.trim().toLowerCase();
        if(nameToId[k])sid=nameToId[k];
        else{const id=store.newId();await store.put("students",id,{name:r.student.trim(),level:"B1",types:["General English"],goals:"",notes:"Imported from your schedule — add their level, goals and materials.",nextSteps:"",materials:"",color:AVATAR_COLORS[(state.students.length+created)%AVATAR_COLORS.length]});sid=id;nameToId[k]=id;created++;state.usingExamples=false;}
      }
      if(state.lessons.find(l=>l.studentId===sid&&l.date===r.date&&(l.time||"")===r.time)){skipped++;continue;}
      await store.put("lessons",store.newId(),{studentId:sid,date:r.date,time:r.time,type:"",topic:"",status:"scheduled",plan:""});added++;
    }
    closeModal();
    toast(added+" lesson"+(added===1?"":"s")+" added"+(created?" · "+created+" new student"+(created===1?"":"s"):"")+(skipped?" · "+skipped+" already there":""));
    render();
  }
  scrim.addEventListener("paste",e=>{const items=(e.clipboardData&&e.clipboardData.items)||[];for(const it of items){if(it.type&&it.type.startsWith("image/")){const f=it.getAsFile();if(f){setFile(f);break;}}}});
  stepPick();
}

    if(state.calMode==="week"){
      if(v==="today")state.weekStart=mondayOf(new Date());
      else{const d=new Date(state.weekStart);d.setDate(d.getDate()+(+v)*7);state.weekStart=d;}
    } else {
      if(v==="today")state.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);
      else state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+(+v),1);
    }
    renderSchedule();return;}
  const modeSeg=t.closest("#modeSeg [data-mode]");if(modeSeg){state.calMode=modeSeg.dataset.mode;renderSchedule();return;}
  const seg=t.closest("#lvlSeg [data-f]");if(seg){state.studentFilter=seg.dataset.f;renderStudents();return;}
});
function handleAct(a){
  if(a==="add-student")studentForm();
  else if(a==="edit-student"){const s=currentStudents().find(x=>x.id===state.activeStudent);if(state.usingExamples){toast("Add your own student to edit profiles");return;}studentForm(s);}
  else if(a==="add-lesson")lessonForm(null,state.view==="student"?state.activeStudent:null);
  else if(a==="delete-student"){
    if(state.usingExamples){toast("This is a sample student");return;}
    const s=currentStudents().find(x=>x.id===state.activeStudent);confirmDelete(s);
  }
  else if(a==="prepare-plans"){prepareAllPlans();}
  else if(a==="ai-copy"){navigator.clipboard&&navigator.clipboard.writeText(lastAIText);toast("Copied to clipboard");}
  else if(a==="ai-save"){saveAIAsPlan();}
  else if(a==="demo-plan"){demoPlan();}
  else if(a==="plan-pdf"){savePlanPDF();}
  else if(a==="plan-edit"){planEdit();}
  else if(a==="plan-tweak"){planTweak();}
  else if(a==="plan-regen"){regenPlan();}
  else if(a==="plan-copy"){navigator.clipboard&&navigator.clipboard.writeText(state.currentPlan||"");toast("Plan copied");}
  else if(a==="plan-attach"){attachPlan();}
  else if(a==="settings"){settingsForm();}
  else if(a==="import"){importForm();}
}
function confirmDelete(s){
  const scrim=scrimWrap(`<div class="modal" style="max-width:420px"><div class="modal-head"><h2>Remove ${esc(s.name)}?</h2><button class="x" data-close><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="modal-body"><p class="fval">This deletes their profile and all logged lessons. This can't be undone.</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn" style="background:var(--danger);border-color:var(--danger);color:#fff" id="confDel">Remove student</button></div></div>`);
  openModal(scrim);
  scrim.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  scrim.querySelector("#confDel").onclick=async()=>{
    for(const l of lessonsFor(s.id))await store.remove("lessons",l.id);
    await store.remove("students",s.id);
    closeModal();toast("Student removed");setView("students");
  };
}

async function boot(){

  const ex=exampleData();state._exStudents=ex.S;state._exLessons=ex.L;

  const decide=()=>{ state.usingExamples=state.students.length===0; };

  store.subscribe("students",arr=>{

    if(state.view==="student"&&!currentStudents().find(x=>x.id===state.activeStudent)){/* keep */}

  // initial paint (in case subscribe callback is async/delayed)
  decide();render();
}
